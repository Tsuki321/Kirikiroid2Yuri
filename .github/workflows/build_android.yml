name: build android
on:
  push:
    branches: ['yuri', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_NAME: krk2yuri_android

jobs:
  fetch_thirdparty_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: check thirdparty build
      id: check_thirdparty_build
      uses: actions/cache@v4
      with: 
        path: ./thirdparty/build
        key: thirdparty_build
    
    - name: fetch thirdparty build
      if: steps.check_thirdparty_build.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_build.tar.gz
        tar xvzf thirdparty_build.tar.gz

  fetch_thirdparty_port:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: check thirdparty port
      id: check_thirdparty_port
      uses: actions/cache@v4
      with: 
        path: ./thirdparty/port
        key: thirdparty_port
    
    - name: fetch thirdparty port
      if: steps.check_thirdparty_port.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_port.tar.gz
        tar xvzf thirdparty_port.tar.gz

  test:
    # Host unit tests — no thirdparty deps, no Android SDK. Runs in parallel
    # with the fetch/build jobs. Pure-logic components only (md5, bitap, ...).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -B build_test -DKRKR2_BUILD_TESTS=ON -DKRKR2_TEST_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug

    - name: Build tests
      run: cmake --build build_test -j

    - name: Run tests
      run: ctest --test-dir build_test --output-on-failure

  build_android:
    runs-on: ubuntu-latest
    needs: 
      - test
      - fetch_thirdparty_build
      - fetch_thirdparty_port

    steps:
    - uses: actions/checkout@v4

    - name: get thirdparty build cache
      uses: actions/cache@v4
      with: 
        key: thirdparty_build
        path: ./thirdparty/build

    - name: get thirdparty port cache
      uses: actions/cache@v4
      with: 
        key: thirdparty_port
        path: ./thirdparty/port
   
    - uses: actions/setup-java@v3
      with:
        java-version:  |
            8
            11
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386
        packages: build-tools;33.0.2 platforms;android-33 ndk;25.2.9519653

    - name: Install p7zip
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: build krkr2yuri android
      env:
        SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
        SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
      run: |
        wget https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/1.3.9_yuri/Kirikiroid2_yuri_1.3.9.apk
        7z x Kirikiroid2_yuri_1.3.9.apk assets
        mkdir -p ./build_android
        cd project/android
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Check native 16 KB alignment
      run: python3 tests/android/check_apk.py build_android/outputs/apk/debug/*.apk

    - name: create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "./build_android/outputs/apk/debug/*.apk"
        allowUpdates: "true"
        prerelease: "true"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: upload apk artifact
      uses: actions/upload-artifact@v4
      with:
        name: krkr2yuri-debug-apk
        path: ./build_android/outputs/apk/debug/*.apk

  emulator:
    name: Android ${{ matrix.api }} (${{ matrix.target }})
    needs: build_android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: google_apis
          - api: 35
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: krkr2yuri-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}-${{ matrix.target }}
          path: test-results/android
