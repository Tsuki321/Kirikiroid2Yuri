name: build android
on:
  push:
    branches: ['yuri', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_build_run:
        description: Existing successful APK build and native suites to verify without rebuilding
        required: false
        default: ''

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read

jobs:
  dependencies:
    if: inputs.reuse_build_run == ''
    name: Verify ${{ matrix.kind }} bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: build
            path: thirdparty/build
          - kind: source
            path: thirdparty/port
          - kind: assets
            path: assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: android-deps-${{ matrix.kind }}-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: ${{ matrix.path }}
      - name: Verify and fetch pinned bundle
        run: python3 script/fetch_ci_dependencies.py ${{ matrix.kind }}

  test:
    if: inputs.reuse_build_run == ''
    name: Native regressions (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        # The Python inspection tests also assert that member payloads are never read.
        run: |
          sudo apt-get update && sudo apt-get install -y libonig-dev
          python3 -m pip install pycryptodome==3.23.0
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          python3 script/create_xp3_fixtures.py build_test_fixtures
          cmake -B build_test -DKRKR2_BUILD_TESTS=ON -DKRKR2_TEST_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build_test -j2
      - name: Run tests
        run: ctest --test-dir build_test --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tests-${{ matrix.compiler }}
          path: build_test/results.xml
          retention-days: 7

  build_android:
    if: inputs.reuse_build_run == ''
    name: Build and verify Android APKs
    needs: [test, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          key: android-deps-build-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: thirdparty/build
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: android-deps-source-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: thirdparty/port
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: android-deps-assets-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: assets
          fail-on-cache-miss: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;33.0.2 platforms;android-29 ndk;25.2.9519653
      - uses: actions/cache@v4
        with:
          key: native-ccache-ndk25-${{ github.sha }}
          restore-keys: native-ccache-ndk25-
          path: .ccache
      - name: Install fixture generator and compiler cache
        timeout-minutes: 6
        run: |
          missing=()
          for tool in ffmpeg ccache; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            if ! sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"; then
              timeout 180s sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
            fi
          fi
      - name: Build, sign test APKs, and verify alignment
        env:
          CI_DEBUG_KEYSTORE_B64: ${{ secrets.CI_DEBUG_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
        run: bash script/build_ci_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-debug-apk
          path: build_android/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-release-test-apk
          path: build_android/outputs/apk/ci-release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-debug-android-tests
          path: build_android/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-release-android-tests
          path: build_android/outputs/apk/androidTest/release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: krkr2yuri-signed-release
          path: build_android/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krkr2yuri-native-symbols
          path: build_android/intermediates/cxx/**/obj/arm64-v8a/libkrkr2yuri.so
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-diagnostics
          path: |
            test-results
            build_android/outputs/mapping/release
          retention-days: 7

  verify_existing:
    name: Verify existing build provenance
    if: inputs.reuse_build_run != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful build, native suites and unchanged application source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.reuse_build_run }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run = os.environ['BUILD_RUN']
          assert run.isdecimal(), 'Build run must be numeric'
          state = json.loads(subprocess.check_output(['gh', 'run', 'view', run,
              '--json', 'headSha,jobs,status']))
          assert state['status'] == 'completed'
          required = {'Build and verify Android APKs', 'Native regressions (gcc)', 'Native regressions (clang)'}
          passed = {job['name'] for job in state['jobs'] if job['conclusion'] == 'success'}
          assert required <= passed, 'Original APK build and both native suites must pass'
          changed = subprocess.check_output(['git', 'diff', '--name-only', state['headSha'], 'HEAD'], text=True).splitlines()
          assert all(path.startswith(('tests/', '.github/')) for path in changed), changed
          print('Verified existing APK source:', state['headSha'])
          PY

  emulator:
    name: Android ${{ matrix.api }} / ${{ matrix.variant }} / ${{ matrix.target }}
    needs: [build_android, verify_existing]
    if: always() && !cancelled() && (needs.build_android.result == 'success' || needs.verify_existing.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.reuse_build_run != '' && '["debug"]' || '["debug", "release"]') }}
        api: [36]
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant == 'release' && 'krkr2yuri-release-test-apk' || 'krkr2yuri-debug-apk' }}
          path: apk
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: krkr2yuri-${{ matrix.variant }}-android-tests
          path: test-apk
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_PROFILE: ${{ inputs.reuse_build_run != '' && 'release' || 'full' }}
        with:
          emulator-build: 15917651
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}-${{ matrix.variant }}-${{ matrix.target }}
          path: test-results/android
          retention-days: 7

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build_android, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: krkr2yuri-signed-release
          path: release
      - uses: ncipollo/release-action@v1
        with:
          artifacts: release/*.apk
          prerelease: true
          generateReleaseNotes: true
