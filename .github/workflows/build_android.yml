name: build android
on:
  push:
    branches: ['yuri', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  dependencies:
    name: Verify ${{ matrix.kind }} bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: build
            path: thirdparty/build
          - kind: source
            path: thirdparty/port
          - kind: assets
            path: assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: android-deps-${{ matrix.kind }}-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: ${{ matrix.path }}
      - name: Verify and fetch pinned bundle
        run: python3 script/fetch_ci_dependencies.py ${{ matrix.kind }}

  test:
    name: Native regressions (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: cmake -B build_test -DKRKR2_BUILD_TESTS=ON -DKRKR2_TEST_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build tests
        run: cmake --build build_test -j2
      - name: Run tests
        run: ctest --test-dir build_test --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tests-${{ matrix.compiler }}
          path: build_test/results.xml
          retention-days: 7

  build_android:
    name: Build and verify Android APKs
    needs: [test, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          key: android-deps-build-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: thirdparty/build
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: android-deps-source-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: thirdparty/port
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: android-deps-assets-${{ hashFiles('script/dependencies.lock.json', 'script/fetch_ci_dependencies.py') }}
          path: assets
          fail-on-cache-miss: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;33.0.2 platforms;android-29 ndk;25.2.9519653
      - name: Install fixture generator
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build, sign test APKs, and verify alignment
        env:
          CI_DEBUG_KEYSTORE_B64: ${{ secrets.CI_DEBUG_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
        run: bash script/build_ci_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-debug-apk
          path: build_android/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-release-test-apk
          path: build_android/outputs/apk/ci-release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: krkr2yuri-android-tests
          path: build_android/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: krkr2yuri-signed-release
          path: build_android/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-diagnostics
          path: |
            test-results
            build_android/outputs/mapping/release
          retention-days: 7

  emulator:
    name: Android ${{ matrix.api }} / ${{ matrix.variant }} / ${{ matrix.target }}
    needs: build_android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
        include:
          - api: 30
            target: google_apis
          - api: 35
            target: google_apis_ps16k
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant == 'release' && 'krkr2yuri-release-test-apk' || 'krkr2yuri-debug-apk' }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: krkr2yuri-android-tests
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 15917651
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}-${{ matrix.variant }}-${{ matrix.target }}
          path: test-results/android
          retention-days: 7

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build_android, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: krkr2yuri-signed-release
          path: release
      - uses: ncipollo/release-action@v1
        with:
          artifacts: release/*.apk
          prerelease: true
          generateReleaseNotes: true
